name: CI

on:
  push:
    branches: [main, fix/review-round-1]
  pull_request:
    branches: [main]

jobs:
  client:
    name: Client Checks (Typecheck, Lint, Test, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc -b

      - name: Oxlint check
        run: npm run lint

      - name: Run Vitest test suite
        run: npm test

      - name: Build client production bundle
        run: npm run build

  supabase:
    name: Supabase Database Tests (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local stack
        run: supabase start

      - name: Reset database and apply migrations
        run: supabase db reset

      - name: Run pgTAP test suite
        run: supabase test db
